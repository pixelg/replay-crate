# Local Postgres for development: `pnpm db:up` starts it, `pnpm db:down` stops it.
# The data lives in the `pgdata` volume, so it survives restarts and `docker compose down`.
# Neon takes over when the app is deployed; see DATABASE_URL in .env.schema.
#
# Elasticsearch and Kibana are optional (the `search` profile): `pnpm search:up` / `search:down`.
# With ELASTICSEARCH_URL set the API searches with Elasticsearch, otherwise with Postgres.
name: replay-crate

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: replay
      POSTGRES_DB: replay_crate
    ports:
      # Loopback only, on a port that stays clear of other local Postgres servers.
      - 127.0.0.1:54320:5432
    volumes:
      # Postgres 18 images keep data in a versioned directory under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U replay -d replay_crate]
      interval: 2s
      timeout: 5s
      retries: 15

  # Single node, security off: it only listens on loopback, for local development.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s']
      interval: 5s
      timeout: 10s
      retries: 30

  # Dashboards over the plays and search logs (`pnpm kibana:load` imports them): http://127.0.0.1:5601
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1
    profiles: [search]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: 'false'
    ports:
      - 127.0.0.1:5601:5601
    healthcheck:
      test: [CMD-SHELL, curl -fs http://localhost:5601/api/status | grep -q '"level":"available"']
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  esdata:
