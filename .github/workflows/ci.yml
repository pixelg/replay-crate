name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
      # Required by the web app's env schema. Public by design (PKCE), and CI never talks to Spotify.
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      # Uses the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's local task cache, carried between runs: packages whose inputs haven't changed
      # replay their typecheck/test/build results instead of running again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm typecheck
      # typecheck regenerates the OpenAPI spec and the web app's types from it; both are committed.
      - name: Generated API files are up to date
        run: git diff --exit-code -- apps/api/openapi.json apps/web/src/test/api.gen.ts
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @replay-crate/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Storybook tests and E2E
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @replay-crate/web exec playwright install --with-deps chromium
      # The browser comes from the cache; its system libraries don't.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @replay-crate/web exec playwright install-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook
      # Built app + API with an in-memory DB and a fake Spotify, desktop and phone sizes.
      - run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The search contract suite (apps/api/src/search/contract.ts) against a real Elasticsearch,
  # the engine the app uses when ELASTICSEARCH_URL is set. The check job runs it on Postgres.
  search:
    name: search (Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @replay-crate/api exec vitest run src/search
