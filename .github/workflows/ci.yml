name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether anything but docs changed. A change to only Markdown files (README, CLAUDE.md…) or the
  # licence can't break what the jobs below test, so they're skipped for it. Skipped, not left out
  # (as `paths-ignore` would), so the required `check` still reports: a skipped job counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (a new branch, a force push): test everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md|^LICENSE)$'; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  # The checks run as parallel jobs, each on its own runner: setup costs ~20 s, and one runner
  # doing them in turn took twice as long. `check` (below) sums them up for branch protection.
  static:
    name: lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
      # Required by the web app's env schema. Public by design (PKCE), and CI never talks to Spotify.
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      # typecheck regenerates the OpenAPI spec and the web app's types from it; both are committed.
      - name: Generated API files are up to date
        run: git diff --exit-code -- apps/api/openapi.json apps/web/src/test/api.gen.ts
      - run: pnpm build
      - run: pnpm build-storybook

  unit:
    name: API and package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test --filter='!@replay-crate/web'

  stories:
    name: web stories
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - run: pnpm exec turbo run test --filter=@replay-crate/web

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      # Built app + API with an in-memory DB and a fake Spotify, desktop and phone sizes.
      - run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The one result branch protection requires (with the search job): passes when every check
  # passed or was skipped (a docs-only change), fails if any failed or was cancelled.
  check:
    needs: [changes, static, unit, stories, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The search contract suite (apps/api/src/search/contract.ts) against a real Elasticsearch,
  # the engine the app uses when ELASTICSEARCH_URL is set. The check job runs it on Postgres.
  search:
    name: search (Elasticsearch)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @replay-crate/api exec vitest run src/search
