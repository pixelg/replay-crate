<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <script>
      // Theme before first paint, so a dark page never flashes light (see src/lib/theme.ts).
      ;(function () {
        var pref
        try { pref = localStorage.getItem('rc:theme') } catch (e) {}
        var theme = pref === 'light' || pref === 'dark' ? pref : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161412')
      })()
    </script>
    <title>Replay Crate</title>
    <meta name="description" content="Every Spotify play, counted: your full listening history, play counts, playlists, stats and a player." />
    <!-- Link previews (site-wide: the app is a single page). URLs are absolute, from the app's origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Replay Crate" />
    <meta property="og:title" content="Replay Crate" />
    <meta property="og:description" content="Every Spotify play, counted: your full listening history, play counts, playlists, stats and a player." />
    <meta property="og:url" content="%APP_ORIGIN%/" />
    <meta property="og:image" content="%APP_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Replay Crate record logo on a dark background, with the tagline: every Spotify play, counted." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
